name: Build Standalone Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Executable
        run: npm run build:win

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          mkdir release-win
          Copy-Item run-bot.exe release-win/
          Copy-Item (Get-Command ffmpeg).Source release-win/
          Copy-Item .env.example release-win/
          Copy-Item README.md release-win/
          Copy-Item LICENSE release-win/
          Compress-Archive -Path release-win/* -DestinationPath spotify-connect-discord-bot-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: spotify-connect-discord-bot-windows-x64.zip
          draft: false
          prerelease: false
